worker_processes 1;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr;
    server {
        listen 8081;
        root /var/www/static;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}