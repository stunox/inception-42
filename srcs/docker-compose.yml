services:
  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html:ro
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    env_file:
      - .env
    environment:
      - WP_REDIS_ENABLED=${WP_REDIS_ENABLED:-0}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
      - redis_password
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "wp core is-installed --allow-root --path=/var/www/html"]
      interval: 10s
      timeout: 5s
      retries: 30

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - database:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    build: ./requirements/bonus/redis
    image: redis:inception
    profiles: ["bonus"]
    restart: unless-stopped
    secrets:
      - redis_password
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:inception
    profiles: ["bonus"]
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "pidof vsftpd"]
      interval: 10s
      timeout: 5s
      retries: 5

  static:
    build: ./requirements/bonus/static
    image: static:inception
    profiles: ["bonus"]
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - inception

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:inception
    profiles: ["bonus"]
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - inception

  backup:
    build: ./requirements/bonus/backup
    image: backup:inception
    profiles: ["bonus"]
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    secrets:
      - db_password
    volumes:
      - wordpress_files:/var/www/html:ro
      - backups:/backups
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "pidof cron"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/database
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress
  backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/backups

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  redis_password:
    file: ../secrets/redis_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
